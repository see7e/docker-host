pages:
  - name: Startpage
    width: slim
    hide-desktop-navigation: true
    center-vertically: true
    columns:

      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
            
          - type: weather
            location: Porto, Portugal
            units: metric
            hour-format: 24h
            hide-location: true

          - type: server-stats
            servers:
              - type: local
                name: Services
                
          # - type: dns-stats
          #   service: adguard
          #   url: https://adguard.domain.com/
          #   username: admin
          #   password: {ADGUARD_PASSWORD}
          
      - size: full
        widgets:
          - type: search
            autofocus: true

          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: Grafana Dashboards
                url: http://192.168.1.108:3000/dashboards/
                icon: si:grafana
              - title: Home Assistant
                url: http://192.168.1.111/home/overview
                icon: si:homeassistant
              - title: OpenMediaVault
                url: http://192.168.1.107/#/login
                icon: si:openmediavault
              - title: Proxmox
                url: https://192.168.1.200:8006/
                icon: si:proxmox
              # - title: Prometheus
              #   url: http://192.168.1.108:9090/targets
              #   icon: si:prometheus

          - type: monitor
            cache: 1m
            title: Media
            sites:
              - title: Jellyfin
                url: http://192.168.1.108:8096
                icon: si:jellyfin
                
              - title: Bazarr (for subs)
                url: http://192.168.1.108:6767
                icon: si:bazarr

              - title: Radarr (for Movies)
                url: http://192.168.1.108:7878
                icon: si:radarr

              - title: Sonarr (for Shows)
                url: http://192.168.1.108:8989
                icon: si:sonarr

          # - type: group
              # - title: Gitea
              #   url: https://yourdomain.com/
              #   icon: si:gitea
              # - title: qBittorrent # only for Linux ISOs, of course
              #   url: https://yourdomain.com/
              #   icon: si:qbittorrent
              # - title: Immich
              #   url: https://yourdomain.com/
              #   icon: si:immich
              # - title: AdGuard Home
              #   url: https://yourdomain.com/
              #   icon: si:adguard
              # - title: Vaultwarden
              #   url: https://yourdomain.com/
              #   icon: si:vaultwarden

          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Gmail
                    url: https://mail.google.com/mail/u/0/
                  - title: Amazon
                    url: https://www.amazon.es/
                  - title: Github
                    url: https://github.com/
              - title: Entertainment
                color: 10 70 50
                links:
                  - title: YouTube
                    url: https://www.youtube.com/
              - title: Social
                color: 200 50 50
                links:
                  - title: Reddit
                    url: https://www.reddit.com/

