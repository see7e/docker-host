global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # if node-exporter
  - job_name: node-exporter
    static_configs:
      - targets:
          - host.docker.internal:9100
  
