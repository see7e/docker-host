services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - /mnt/omv/.infra/docker/prometheus/data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - monitoring

networks:
  monitoring:
    external: true
