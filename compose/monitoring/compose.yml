services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    ports:
      - "9090:9090"

    volumes:
      - /opt/docker/data/prometheus:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - monitoring

    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped

    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    ports:
      - "3000:3000"

    volumes:
      - /opt/docker/data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

    privileged: true

    devices:
      - /dev/kmsg

    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"
      - "--max_housekeeping_interval=35s"
      - "--store_container_labels=false"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/config.yml"

    volumes:
      - /opt/docker/data/loki:/loki
      - ./loki/config.yml:/etc/loki/config.yml:ro

    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - monitoring

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Persistent Alloy state (positions, WAL, etc.)
      - /opt/docker/data/alloy:/var/lib/alloy

      # Docker discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Host logs
      - /var/log:/var/log:ro

    depends_on:
      loki:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "busybox", "wget", "--spider", "-q", "http://localhost:12345/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - monitoring

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9221/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      PVE_USER: prometheus@pve
      PVE_TOKEN_NAME: prometheus
      PVE_TOKEN_VALUE: ${PROMETHEUS_PVE_TOKEN}
      PVE_VERIFY_SSL: "false"

    networks:
      - monitoring

  nut-exporter:
    # Stable v1
    image: hon95/prometheus-nut-exporter:1
    environment:
      - TZ=Europe/Oslo
      - HTTP_PATH=/metrics
      # Defaults
      #- RUST_LOG=info
      #- HTTP_PORT=9995
      #- HTTP_PATH=/nut
      #- LOG_REQUESTS_CONSOLE=false
      #- PRINT_METRICS_AND_EXIT=false
    networks:
      - monitoring


networks:
  monitoring:
    external: true

  backend:
    external: true
